# Publish Vigilume container images to GitHub Container Registry (GHCR).
#
# WHY: without published images, deploying Vigilume means cloning the repo and
# building a ~5 GB CUDA image on your own box — which needs 10–15 GB of free
# Docker storage at the build peak and is the single most common way a first
# install fails. Pulling a prebuilt image removes that entirely.
#
# NOTE: docker-compose.yml BUILDS the backend rather than pulling it, so the
# supported path does not depend on these images — they exist for anyone who
# would rather pull than build (swap the backend's `build:` for
# `image: ghcr.io/eternus-nox/vigilume-backend:latest`). This was previously
# load-bearing for a Portainer web-editor stack, which no longer exists; if
# nobody is pulling these, the file can go.
#
# THIS PUBLISHES PUBLICLY. Images pushed here are visible to anyone once the
# package is made public in the repo's Packages settings. That is fine for this
# project — the audit confirmed the Dockerfiles take no build args, no build
# secrets, and bake in nothing host-specific — but it IS a publishing action,
# so it never runs on an ordinary push: only on a version tag, or when you
# start it by hand from the Actions tab.
#
# To stop publishing entirely, delete this file.

name: Publish images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: latest)"
        required: false
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # Keep going if one image fails — a broken web build should not block a
      # good backend build from publishing.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            # `gpu` is also the last stage in backend/Dockerfile, so this is
            # explicit rather than strictly necessary. Stated anyway: the `cpu`
            # stage exists for tests and must never be published as the
            # default image.
            target: gpu
            heavy: true
          - name: web
            context: ./frontend
            target: ""
            heavy: false
          - name: push-relay
            context: ./relay
            target: ""
            heavy: false

    steps:
      - uses: actions/checkout@v4

      # The backend is a CUDA image: ~5 GB final, 10–15 GB at the build peak
      # while pip holds the downloaded CUDA wheels and their unpacked form at
      # the same time. A stock runner does not reliably have that much free, so
      # reclaim the preinstalled toolchains we do not use. Only worth the ~1
      # minute it costs on the heavy build.
      - name: Reclaim runner disk
        if: matrix.heavy
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL || true
          echo "after:"; df -h / | tail -1

      # Provides BuildKit. backend/Dockerfile uses a heredoc (`RUN python - <<'PY'`)
      # for its build-time CUDA/cuDNN sanity check, which the classic builder
      # cannot parse — it fails with a misleading "unknown instruction".
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase in a repository path, and GitHub owner names are
      # frequently mixed-case (Eternus-Nox -> eternus-nox).
      - name: Resolve image reference
        id: ref
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="${{ inputs.tag }}"
          fi
          echo "image=ghcr.io/${owner}/vigilume-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "version=${version:-latest}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          # amd64 ONLY, and not an oversight. onnxruntime-gpu is installed from
          # the onnxruntime-cuda-12 feed, which publishes x86_64 manylinux
          # wheels only — an arm64 backend build cannot succeed. Publishing a
          # faked multi-arch manifest would be worse than none: arm64 users
          # would pull an image that fails at runtime instead of failing to
          # pull at all.
          platforms: linux/amd64
          tags: |
            ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.version }}
            ${{ steps.ref.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
